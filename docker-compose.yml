services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "8333:8333" # S3 API endpoint
      - "9333:9333" # SeaweedFS master server
      - "8888:8888" # SeaweedFS filer UI
    command: "server -s3 -dir=/data"
    volumes:
      - seaweed-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      USE_CELERY: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LYRICVID_TEMP_ROOT: /tmp/lyricvid
      WHISPER_BACKEND: openai-whisper
      WHISPER_MODEL: large-v3
      WHISPER_LANGUAGE: en
      WHISPER_DEVICE: cpu
      HIDE_INTERNAL_ERRORS: "true"
    ports:
      - "8000:8000"
    volumes:
      - lyricvid-temp:/tmp/lyricvid
      - whisper-cache:/home/lyricvid/.cache
    depends_on:
      - redis
      - seaweedfs

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A backend.tasks.celery_app.celery_app worker --loglevel=INFO --queues=celery
    env_file:
      - .env
    environment:
      APP_ENV: production
      USE_CELERY: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LYRICVID_TEMP_ROOT: /tmp/lyricvid
      WHISPER_BACKEND: openai-whisper
      WHISPER_MODEL: large-v3
      WHISPER_LANGUAGE: en
      WHISPER_DEVICE: cpu
      HIDE_INTERNAL_ERRORS: "true"
    volumes:
      - lyricvid-temp:/tmp/lyricvid
      - whisper-cache:/home/lyricvid/.cache
    depends_on:
      - redis
      - seaweedfs

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  lyricvid-temp:
  whisper-cache:
  seaweed-data:
